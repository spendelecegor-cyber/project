<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css">

</head>
<body>
<div class="container">                
<div class="contentbar">                
        <!-- Start row -->
        <div class="row">
            <!-- Start col -->
            <div class="col-md-12 col-lg-12 col-xl-12">
                <div class="card m-b-30">
                    <div class="card-header">
                        <h5 class="card-title">Cart</h5>
                    </div>
                    <div class="card-body">
                        <div class="row justify-content-center">
                            <div class="col-lg-10 col-xl-8">
                                <div class="cart-container">
                                    <div class="cart-head">
                                        <div class="table-responsive">
                                            <table class="table table-borderless">
                                                <thead>
                                                    <tr>
                                                        <th scope="col">#</th>
                                                        <th scope="col">Действие</th>                                               
                                                        <th scope="col">Фото</th>
                                                        <th scope="col">Товар</th>
                                                        <th scope="col">Количество</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="cartTableBody">
                                                    
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <div class="cart-body">
                                        <div class="row">
                                            <div class="mb-3">
                                                <label for="exampleFormControlInput1" class="form-label">Ваш email адрес</label>
                                                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                                              </div>
                                              <div class="mb-3">
                                                <label for="exampleFormControlTextarea1" class="form-label">Пожелания к заказу</label>
                                                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                                              </div>
                                        </div>
                                    </div>
                                    <div class="cart-footer text-right">
                                        <button type="submit" class="btn btn-primary mb-3">Отправить заказ</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End col -->
        </div>
        <!-- End row -->
    </div>
    </div>
<script>function renderCart() {
        const products = JSON.parse(localStorage.getItem('products')) ||
            [];
        const tableBody = document.getElementById('cartTableBody');
        tableBody.innerHTML = ''; //Очисткатекущего содержимого
        products.forEach((product, index) => {
            const row = `<tr>
<th scope="row">${index + 1}</th>
<td><a href="#" class="text-danger"
onclick="deleteProduct('${product.name}')"><i
class="ri-delete-bin-3-line"></i></a></td>
<td><img src="${product.imageUrl}"
class="img-fluid" width="35" alt="product"></td>
<td>${product.name}</td>
<td>
<div class="form-group mb-0">
<input type="number"
class="form-control cart-qty" name="cartQty${index + 1}" id="cartQty${index
                + 1}" value="${product.count}">
</div>
</td>
</tr>`;
            tableBody.innerHTML += row;
        });
    }
function deleteProduct(productName) {
let products = JSON.parse(localStorage.getItem('products')) ||
[];
products = products.filter(product => product.name !==
productName);
localStorage.setItem('products', JSON.stringify(products));
renderCart(); //Перерисовкатаблицы
}
document.addEventListener('DOMContentLoaded', renderCart);
</script>
    
</body>
</html>
